<!DOCTYPE html>
<html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sirius · Autopraonica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Sora:wght@600;700&display=swap">
<style>:root{color-scheme:light}
:root{--bg:#f1f5f8;--card:#fff;--ink:#14232c;--mut:#5c6f7a;--line:#dbe4ea;--side:#0c2230;--va:#0f7bd8;--d:'Sora','Segoe UI',Arial,sans-serif;--b:'Manrope','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--b)}
.app{display:flex;min-height:100vh}
.side{width:256px;flex-shrink:0;background:linear-gradient(175deg,#123a52 0%,var(--side) 55%);color:#d3e2ea;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;padding:4px 6px 18px}.brand strong{display:block;font:700 18px var(--d);color:#fff;letter-spacing:.06em}.brand small{color:#9fb6c3}
.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#7fd4ff,#0f7bd8);color:#fff;box-shadow:0 4px 12px #0004}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8aa3b1;margin:6px 8px}
.side nav{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;gap:12px;border:1px solid transparent;background:none;color:#d3e2ea;font:600 14px var(--b);padding:7px 9px;border-radius:14px;cursor:pointer;text-align:left;min-height:50px}
.nv svg{width:34px;height:34px;padding:8px;border-radius:11px;background:color-mix(in srgb,var(--ic) 24%,transparent);color:var(--ic);flex-shrink:0}
.nv:hover{background:#ffffff10}.nv.on{background:#ffffff14;border-color:#ffffff26;color:#fff;box-shadow:inset 3px 0 0 var(--ic)}.nv.on svg{background:var(--ic);color:#fff}
.acc{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid #ffffff1f}.acc strong{display:block;color:#fff;font-size:14px}.acc small{color:#9fb6c3}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7fd4ff,#0f7bd8);color:#fff;font-weight:800}
main{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:5;background:#ffffffe6;backdrop-filter:blur(10px);border-bottom:3px solid var(--va);padding:12px 24px}
.demo{font-size:12px;font-weight:800;color:var(--va);letter-spacing:.05em}
.content{padding:22px 24px 40px;max-width:1200px}
.view{display:none}.view.on{display:block}
.vh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,color-mix(in srgb,var(--va) 15%,#fff),#fff 70%);border:1px solid color-mix(in srgb,var(--va) 28%,var(--line));border-left:6px solid var(--va);border-radius:20px;padding:20px 22px;margin-bottom:18px}
.vh>div{min-width:0}.vh h1{margin:2px 0 4px;font:700 clamp(1.5rem,3.4vw,2.1rem) var(--d);text-wrap:balance}.vh p{margin:0;color:var(--mut)}.vh .ov{color:var(--va);font-weight:800;font-size:12px;letter-spacing:.08em}
.ha{display:flex;gap:8px;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:12px;font:700 14px var(--b);cursor:pointer;border:1px solid color-mix(in srgb,var(--va) 35%,var(--line));background:#fff;color:var(--ink)}
.b.p{border:0;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--va) 85%,#fff),var(--va));box-shadow:0 6px 16px color-mix(in srgb,var(--va) 30%,transparent)}
.adv{display:flex;gap:10px;align-items:flex-start;border-radius:16px;border:1px solid #f2cf8c;border-left:6px solid #e0a52a;background:#fff8e8;color:#5c4200;padding:12px 14px;margin-bottom:16px}.adv svg{flex-shrink:0;margin-top:2px}
.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}
.quick button{display:flex;align-items:center;gap:10px;text-align:left;padding:14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--qc) 30%,var(--line));background:color-mix(in srgb,var(--qc) 9%,#fff);cursor:pointer;min-width:0;color:var(--ink);font-family:var(--b)}
.quick button:hover{background:color-mix(in srgb,var(--qc) 18%,#fff)}
.quick svg{flex-shrink:0;width:42px;height:42px;padding:10px;border-radius:13px;background:var(--qc);color:#fff}
.quick span{min-width:0}.quick strong{display:block;font-size:.9rem;line-height:1.25}.quick small{display:block;font-size:.75rem;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-top:4px solid var(--kc);border-radius:18px;padding:16px;box-shadow:0 8px 22px #12324a0d;cursor:pointer;transition:transform .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 12px 26px #12324a1c}
.kpi>div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;color:var(--mut)}
.kpi svg{width:40px;height:40px;padding:9px;border-radius:13px;background:color-mix(in srgb,var(--kc) 15%,#fff);color:var(--kc);flex-shrink:0}
.kpi strong{display:block;font:700 1.8rem var(--d);margin-top:6px;font-variant-numeric:tabular-nums}.kpi strong small{font:600 .9rem var(--b);color:var(--mut)}
.kpi p{margin:4px 0 0;font-size:13px;color:var(--mut)}.kpi em{display:block;margin-top:10px;font:700 12px var(--b);color:var(--kc);font-style:normal}
.sh{display:flex;align-items:center;gap:10px;font:700 1.15rem var(--d);margin:8px 0 12px}.sh::before{content:'';width:10px;height:22px;border-radius:5px;background:var(--va)}
.tw{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 18px #12324a0a;margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:12px 14px;background:color-mix(in srgb,var(--va) 9%,#fff)}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}td small{display:block;color:var(--mut);font-size:.8rem}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--va) 3%,#fff)}tbody tr:hover{background:color-mix(in srgb,var(--va) 9%,#fff)}
.st{display:inline-block;border-radius:99px;padding:4px 11px;font-weight:700;font-size:.8rem;border:1px solid}
.st-g{background:#d8f3e4;color:#0b6b49;border-color:#a6dfc2}.st-a{background:#ffeccc;color:#8a5200;border-color:#f2cf8c}.st-b{background:#dfeaff;color:#2452a8;border-color:#b9cff5}.st-v{background:#ece4ff;color:#5b3fb5;border-color:#cdbdf5}
.bottom{display:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--va) 60%,#fff);outline-offset:2px}
@media(max-width:1100px){.quick{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:767px){
 .side{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px #0006}
 body.menu .side{transform:none}
 .top{padding:10px 16px}.content{padding:16px 16px 110px}
 .vh{padding:16px;border-radius:16px}.ha{display:grid;grid-template-columns:1fr 1fr;width:100%}
 .quick{grid-template-columns:1fr 1fr;gap:10px}.quick button{padding:11px}.quick svg{width:36px;height:36px;padding:8px}
 .kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi strong{font-size:1.45rem}
 thead{display:none}table,tbody{display:block}
 tbody tr{display:block;padding:12px 14px;border-top:1px solid var(--line);border-left:4px solid color-mix(in srgb,var(--va) 55%,#fff)}
 td{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:4px 0;border:0;font-size:.875rem}
 td::before{content:attr(data-label);font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding-top:3px}
 td>*{grid-column:2}td:first-child>*{grid-column:1}
 td:first-child{grid-template-columns:1fr;font-weight:700}td:first-child::before{display:none}
 .st{justify-self:start}
 .bottom{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px #0000001a;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bt{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px var(--b);color:var(--mut);background:none;border:0;padding:6px 2px;border-radius:12px;min-height:52px;cursor:pointer}
 .bt svg{color:var(--bc)}.bt.on{background:color-mix(in srgb,var(--bc) 15%,#fff);color:var(--bc)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.top{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.brand{justify-content:center}.brand img{width:100%;max-width:210px;display:block}
.m{position:fixed;inset:0;background:#0c223099;z-index:50;display:grid;place-items:center;padding:16px}
.mb{background:#fff;border-radius:20px;width:min(480px,100%);max-height:92vh;overflow:auto;padding:20px;border-top:5px solid var(--va)}
.mb h2{font:700 1.2rem var(--d);margin:0 0 12px}
label.f{display:block;margin-bottom:10px;font-weight:700;font-size:.8rem;color:var(--mut)}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:4px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;font:500 15px var(--b);color:var(--ink);background:#fff}
.mb .ha{justify-content:flex-end;margin-top:6px}
.mini{min-height:34px;padding:4px 10px;font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.emp{padding:22px;text-align:center;color:var(--mut)}
.dt{display:flex;gap:12px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.dt input{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;font:600 15px var(--b);background:#fff}
.mb .acts.col{flex-direction:column}.mb .acts.col .b{width:100%}
.mr{display:grid;grid-template-columns:minmax(0,1fr) 96px 78px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-weight:600;font-size:.9rem}
.mr small{display:block;color:var(--mut);font-size:.75rem;font-weight:500}
.mr input{width:100%;min-height:44px;padding:8px;border:1px solid var(--line);border-radius:12px;font:500 15px var(--b);background:#fff;color:var(--ink)}
.mr b{text-align:right;font-variant-numeric:tabular-nums;font-size:.85rem}
.mt{display:flex;justify-content:space-between;padding:10px 0;font-weight:800;border-top:2px solid var(--line);margin-bottom:10px}
</style></head><body>

+`<h2 class="sh">Stanje</h2>`+tb(['Materijal','Na stanju','Cijena','Vrijednost','Radnje'],S.materijal.map(x=>[`${esc(x.naziv)}<small>${esc(x.jed)}</small>`,pill(rnd(x.kol)+' '+x.jed,x.min&&x.kol<=x.min?'a':'g'),`${km(x.cijena)} / ${x.pak} ${esc(x.jed)}<small>${km(uc(x))} po ${esc(x.jed)}</small>`,km(x.kol*uc(x)),ac('materijal',x.id,`<button class="b mini p" data-nab="${x.id}">Nabava</button>`)]),'Još nema materijala. Pritisnite „Novi materijal“.')
+`<h2 class="sh">Potrošnja ovaj mjesec</h2>`+tb(['Materijal','Potrošeno','Trošak'],Object.entries(us).map(([id,u])=>[esc(nm(id).naziv),rnd(u.k)+' '+esc(nm(id).jed),km(u.c)]),'Još nema upisane potrošnje. Materijal upisujete kod svakog pranja.')
+`<h2 class="sh">Po autu (zadnjih 20 pranja)</h2>`+tb(['Vozilo','Datum','Potrošeno','Materijal','Rad','Zarada'],[...S.pranja].sort(byD).filter(x=>(x.mat&&x.mat.length)||fc(x)).slice(0,20).map(x=>[`${esc(x.vozilo)}<small>${esc(x.reg)}</small>`,dm(x.datum),(x.mat||[]).map(m=>esc(nm(m.id).naziv)+' '+m.k+' '+esc(nm(m.id).jed)).join(', '),km(mc(x)),km(fc(x))+'<small>'+tmx(x)+'</small>',km(x.cijena-mc(x)-fc(x))]),'Nema pranja s upisanim materijalom.')},
prodaja(){const t=day(T0()),mj=T0().slice(0,7),pm=sum(S.pranja.filter(x=>x.datum.startsWith(mj)),'cijena'),tr=sum(allTr().filter(x=>x.datum.startsWith(mj)),'iznos');
return hd('KASA I PRODAJA','Kasa i prodaja','Prihod po danima i načinu plaćanja.',bn('Izvoz u Excel','data-exp="kasa"')+bn('Novo pranje','data-new="pranja"',1))
+`<div class="kpis">${kp('#2f9e44','coin','Ukupno danas',km(t.u),t.n+' pranja','prodaja')+kp('#0d9aa8','coin','Gotovina',km(t.g),'Danas','prodaja')+kp('#0f7bd8','coin','Kartica',km(t.k),'Danas','prodaja')+kp('#7a5ad6','coin','Na račun',km(t.r),'Danas','prodaja')}</div>`
+`<div class="kpis">${kp('#2f9e44','coin','Prihod ovaj mjesec',km(pm),'Sva pranja','prodaja')+kp('#e0563f','rec','Troškovi ovaj mjesec',km(tr),'Svi troškovi','troskovi')+kp(pm-tr<0?'#e0563f':'#2f9e44','grid','Razlika ovaj mjesec',km(pm-tr),'Prihod minus troškovi','prodaja')}</div>`
+`<h2 class="sh">Zadnjih 14 dana</h2>`+tb(['Dan','Pranja','Gotovina','Kartica','Na račun','Ukupno'],Array.from({length:14},(_,i)=>{const d=ago(i),x=day(d);return [dm(d),x.n,km(x.g),km(x.k),km(x.r),`<strong>${km(x.u)}</strong>`]}),'')}};
function render(){if(!S.materijal)S.materijal=[];if(S.sat==null)S.sat=7.4;const w=VW.find(x=>x[0]==cur);document.documentElement.style.setProperty('--va',w[3]);$('#c').innerHTML=VIEWS[cur]();document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==cur))}
function show(v){cur=v;document.body.classList.remove('menu');scrollTo(0,0);try{history.replaceState(null,'','#'+v)}catch(e){}render()}
/* izvoz */
const csv=(h,rows)=>'\ufeff'+[h,...rows].map(r=>r.map(c=>{c=String(c??'');return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n');
const EX={pranja:()=>csv(['Datum','Vrijeme','Vozilo','Registracija','Usluga','Cijena','Plaćanje','Klijent','Materijal (KM)','Utrošeni materijal','Sati rada','Minute rada','Fiksni trošak (KM)'],[...S.pranja].sort(byD).map(x=>[dm(x.datum),x.vrijeme,x.vozilo,x.reg,x.usluga,x.cijena,x.nacin,x.klijent,mc(x).toFixed(2).replace('.',','),(x.mat||[]).map(m=>{const i=S.materijal.find(y=>y.id==m.id);return (i?i.naziv:'?')+' '+m.k}).join(', '),x.sati||0,x.min||0,fc(x).toFixed(2).replace('.',',')])),
termini:()=>csv(['Datum','Vrijeme','Klijent','Vozilo','Registracija','Usluga','Status'],[...S.termini].sort(byT).map(x=>[dm(x.datum),x.vrijeme,x.ime,x.vozilo,x.reg,x.usluga,x.status])),
troskovi:()=>csv(['Datum','Kategorija','Opis','Iznos'],allTr().sort((a,b)=>b.datum.localeCompare(a.datum)).map(x=>[dm(x.datum),x.kat,x.opis,x.iznos])),
kasa:()=>csv(['Dan','Pranja','Gotovina','Kartica','Na račun','Ukupno'],[...new Set(S.pranja.map(x=>x.datum))].sort().reverse().map(d=>{const x=day(d);return [dm(d),x.n,x.g,x.k,x.r,x.u]})),
materijal:()=>csv(['Materijal','Jedinica','Na stanju','Pakiranje','Cijena pakiranja','Vrijednost'],S.materijal.map(x=>[x.naziv,x.jed,x.kol,x.pak,x.cijena,(x.kol*uc(x)).toFixed(2).replace('.',',')])),
json:()=>JSON.stringify(S)};
async function dl(name,data){try{const d=await claude.use('downloads');if(d)return await d.save({filename:name,data})}catch(e){if(e&&e.code=='declined')return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;a.click()}
function expMenu(){const m=document.createElement('div');m.className='m';m.innerHTML=`<div class="mb"><h2>Izvoz u Excel (CSV)</h2><div class="acts col">${[['pranja','Pranja'],['termini','Termini'],['troskovi','Troškovi'],['kasa','Kasa po danima'],['materijal','Materijal i zalihe'],['json','Sigurnosna kopija (svi podaci)']].map(([k,l])=>`<button class="b" data-exp="${k}">${l}</button>`).join('')}<label class="b">Vrati iz kopije (zamjenjuje sve)<input type="file" accept=".json" hidden></label></div><div class="ha"><button class="b" data-x>Zatvori</button></div></div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.append(m)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-nab],[data-v],[data-go],[data-new],[data-edit],[data-del],[data-fin],[data-exp],[data-exp-open],[data-x],#more');if(!t)return;const D=t.dataset;
if(t.id=='more')return document.body.classList.toggle('menu');
if(D.nab)return openForm('nabava',D.nab);if(D.v)return show(D.v);if(D.go)return show(D.go);if(D.new)return openForm(D.new);
if(D.edit){const[c,i]=D.edit.split(':');return openForm(c,i)}
if(D.del){if(!t.dataset.sure){t.dataset.sure=1;t.textContent='Sigurno?';return void setTimeout(()=>{t.dataset.sure='';t.textContent='Briši'},3000)}const[c,i]=D.del.split(':');if(c=='pranja'){const p=S.pranja.find(x=>x.id===i);(p.mat||[]).forEach(m=>{const it=S.materijal.find(y=>y.id==m.id);if(it)it.kol=rnd(it.kol+m.k)})}S[c]=S[c].filter(x=>x.id!==i);save();return render()}
if(D.fin){const x=S.termini.find(y=>y.id==D.fin),u=S.usluge.find(y=>y.naziv==x.usluga);return openForm('pranja',null,{vozilo:x.vozilo,reg:x.reg,usluga:x.usluga,klijent:x.ime,cijena:u?u.cijena:''},()=>x.status='Završeno')}
if('expOpen' in D)return expMenu();
if(D.exp)return dl(D.exp=='json'?'sirius-kopija.json':'sirius-'+D.exp+'.csv',EX[D.exp]());
if('x' in D)t.closest('.m')&&t.closest('.m').remove()});
document.addEventListener('change',e=>{const t=e.target;if('sat' in t.dataset){S.sat=parseFloat(t.value)||0;save();return}if(t.dataset.ui){ui[t.dataset.ui]=t.value||ui[t.dataset.ui];render()}
if(t.type=='file'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.pranja)throw 0;S=d;save();t.closest('.m').remove();render()}catch(x){t.parentNode.textContent='Datoteka nije ispravna kopija.'}};r.readAsText(t.files[0])}});
const h=location.hash.slice(1);show(VW.some(v=>v[0]==h)?h:'pregled');
initDb();
</script></body></html>
